name: treningi

services:
  db:
    image: postgres:17-alpine
    container_name: treningi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: treningi
      POSTGRES_USER: treningi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w pliku .env}
    volumes:
      - treningi-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # tylko z tego komputera (np. pgAdmin/DBeaver)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treningi -d treningi"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: treningi-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: treningi
      PGUSER: treningi
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_USER: ${APP_USER:-default}
    ports:
      - "8080:8080"

volumes:
  treningi-data:
